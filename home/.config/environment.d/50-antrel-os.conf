# Environment of every graphical session: systemd --user reads this, so Hyprland (uwsm) and GNOME both get it.

# FreeType draws thin stems by default; darkening brings text weight closer to Windows.
FREETYPE_PROPERTIES="cff:no-stem-darkening=0 autofitter:no-stem-darkening=0"

# NVIDIA: VA-API video decoding (Firefox, players) and the NVIDIA GLX vendor.
LIBVA_DRIVER_NAME=nvidia
NVD_BACKEND=direct
__GLX_VENDOR_LIBRARY_NAME=nvidia

# Electron/Chromium apps run as native Wayland clients.
ELECTRON_OZONE_PLATFORM_HINT=auto
